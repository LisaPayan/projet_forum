name: CI

on:
  push:
    branches: [main, lisa]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [client, server]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.dir }}/go.mod

      - name: gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Fichiers mal formatés :"
            gofmt -l .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...