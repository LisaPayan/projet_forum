{{define "register"}}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription</title>
    <link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <h2>Créer un compte</h2>
        
        <!-- {{if .}}
            <div class="error-message" style="color: red; margin-bottom: 15px;">{{.}}</div>
        {{end}} -->

        <form action="/register" method="POST">
            <div class="form-group">
                <label for="pseudo">Pseudo</label>
                <input type="text" name="pseudo" id="pseudo" required placeholder="Votre pseudo">
            </div>
            <div class="form-group">
                <label for="email">Adresse Email</label>
                <input type="email" name="email" id="email" required placeholder="exemple@mail.com">
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" name="password" id="password" required placeholder="********">
                <div>
                    Minimum 12 caractères, une majuscule et un caractère spécial.
                </div>
            </div>
            <button type="submit" class="btn">S'inscrire</button>
        </form>
        <p style="margin-top: 15px;">Déjà un compte ? <a href="/login">Connectez-vous ici</a>.</p>
    </div>
</body>
</html>
{{end}}
