{{define "menu"}}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/menu.css">
    <title>Soulèu</title>
</head>

<body>
    <header class="menu">
        <div class="logo"><img src="../assets/img/logo.jpg"></div>
        <div class="lien">
            <a></a>

        </div>
        <div class="connexion">
            <a>
                <h3>Se connecter</h3>
            </a>
            <a><button class="btn">S'inscrire</button></a>
        </div>
    </header>
    <main>
        <div class="page_menu">
            <div class="pres">
                <div>
                    <h1 class="title">Bienvenue sur Soulèu !</h1>
                </div>
                <div>
                    <h4>Le forum qui sent bon la Provence, on discute de tout : recettes, pétanque, coins secrets...
                    </h4>
                </div>
                <div><button class="btn">+ fil de discussion</button></div>
            </div>
            <div class="cont_fils">
                {{range .}}
                <a href="/fil/{{.Id}}/messages" class="fil-link">
                    <div class="fil">
                        <div class="img_tag">
                            <img src="/assets/img/petanque.jpg">
                        </div>
                        <div class="carac">
                            <div class="title">
                                <h2>{{.Titre}}</h2>
                            </div>
                            <div>{{.Pseudo}}</div>
                        </div>
                    </div>
                </a>
                {{end}}
            </div>
        </div>
    </main>

</body>

</html>
{{end}}
