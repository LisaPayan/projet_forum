{{define "fil_create"}}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/menu.css">
    <title>Créaction d'un fil</title>
</head>

<body>
    <header class="menu">
        <div class="logo"><img src="../assets/img/logo.jpg"></div>
        <div class="lien">
            <div class="dropdown">
                <button type="button" class="dropdown-btn" onclick="toggleDropdown()"
                    title="clique ici pour voir tous les sujets de discussion">Sujets ▾</button>
                <div id="dropdown-menu" class="dropdown-content">
                    <a href="/fils/petanque" title="clique ici pour voir tous les fils de pétanque">Pétanque</a>
                    <a href="/fils/cuisine" title="clique ici pour voir tous les fils de cuisine">Cuisine</a>
                    <a href="/fils/nature" title="clique ici pour voir tous les fils de nature">Nature</a>
                </div>
                <button type="button" class="dropdown-btn"><a href="/all"
                        title="clique ici pour voir tous les fils de discussion">All</a></button>
            </div>
        </div>
        <div class="content_search">
            <div class="div_search">
                <form action="/search" method="get">
                    <input class="search_barre" type="text" name="query" placeholder="titre, nom créateur, tag">
                    <button class="button_search" type="submit"
                        title="Clique ici pour avoir les résultats de ta recherche">Recherche</button>
                </form>
            </div>
        </div>
        <div class="connexion">
            <a href="/login" title="clique ici pour te connecter">
                <h3>Se connecter</h3>
            </a>
            <a href="/register" title="clique ici pour t'inscrire"><button class="btn">S'inscrire</button></a>
        </div>
    </header>
    <main>
        <div class="page_menu">
            <div class="pres">
                <div>
                    <h1 class="title">Créaction de votre fil</h1>
                </div>
                <div>
                    <h4>Soyez l'auteur d'une discussion</h4>
                </div>
            </div>

            <div class="cont_form_login">
                <div class="form_connec">
                    <div>
                        <h2>Créez un fil</h2>
                    </div>
                    <form action="/fils" method="POST">
                        <div class="form-group">
                            <label for="titre">Titre du fil :</label>
                            <input type="text" id="titre" name="titre" required
                                placeholder="Ex: Les meilleurs coins à champignons">
                        </div>

                        <div class="form-group">
                            <label for="tag_id">Choisir un sujet :</label>
                            <select name="tag_id" id="tag_id" required>
                                <option value="1">Pétanque</option>
                                <option value="2">Cuisine</option>
                                <option value="3">Nature</option>
                            </select>
                        </div>
                        <button type="submit" class="btn">Publier le fil</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script src="/assets/js/script.js"></script>

</body>

</html>
{{end}}
